[project]
name = "map-qa"
version = "0.1.0"
description = "Map QA CLI: OSM vs Overture road attribute review with street photos (Kraków)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==1.5.6",
    "pyarrow==23.0.1",
    "Pillow==12.0.0",
    "httpx==0.28.1",
    "Jinja2==3.1.6",
    "pydantic==2.14.2",
]

[project.scripts]
map-qa = "map_qa.cli:main_entry"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "respx==0.23.1",
    "geopandas==1.2.0",
    "pyproj==3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/map_qa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_api: calls real external endpoints (OpenRouter, Databricks); needs credentials",
    "slow: takes more than a few seconds",
]
